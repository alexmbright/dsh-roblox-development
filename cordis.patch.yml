# Derived from the standard preset; tool setup and new-session route defaults are Host-owned.
- id: subagent-model-selection-settings
  # Only the models chosen in Settings -> Roblox routing are dispatchable; the bundle ships none.
  # A fresh install has no saved choices until the panel seeds every cell with the main model and
  # recomposes, so until then selection stays off and workers inherit the lead (main) model:
  # DSH rejects an enabled selection with an empty allow-list.
  config:
    enabled: !!js >-
      (() => {
        const fs = process.getBuiltinModule('node:fs');
        const profile = process.env.DSH_PROFILE_DIR;
        if (typeof profile !== 'string' || profile === '') return false;
        try {
          const state = JSON.parse(fs.readFileSync(profile + '/roblox-routing.json', 'utf8'));
          return Object.values(state.overrides ?? {}).some(entry => entry && typeof entry.provider === 'string' && entry.provider !== '' && typeof entry.model === 'string' && entry.model !== '');
        } catch (error) { return false; }
      })()
    allowedModels: !!js >-
      (() => {
        const fs = process.getBuiltinModule('node:fs');
        const chosen = [];
        const profile = process.env.DSH_PROFILE_DIR;
        if (typeof profile === 'string' && profile !== '') {
          try {
            const state = JSON.parse(fs.readFileSync(profile + '/roblox-routing.json', 'utf8'));
            for (const entry of Object.values(state.overrides ?? {})) {
              if (entry && typeof entry.provider === 'string' && entry.provider !== '' && typeof entry.model === 'string' && entry.model !== '') chosen.push(entry);
            }
          } catch (error) { /* no saved state yet, or unreadable: nothing chosen */ }
        }
        return [...new Map(chosen.map(route => [route.provider + '/' + route.model, { provider: route.provider, model: route.model }])).values()];
      })()
- insert:
    - id: roblox-routing-controls
      name: '@alexturbo/dsh-roblox-development/routing-controls'
    - id: roblox-toolchain
      name: '@alexturbo/dsh-roblox-development/toolchain'
    - id: roblox-bundle-anchor
      name: '@alexturbo/dsh-roblox-development'
      config:
        compat: false
    - id: preset-roblox
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: roblox
        name: Roblox development
        description: Workspace-local tooling, pinned Roblox skills, explicit worker routes, and a single Studio operator.
        order: 20
        plugins:
          - id: roblox-mcp-result-compat
            name: '@alexturbo/dsh-roblox-development'
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are the Roblox development COORDINATOR powered by {{model}}, not the default implementer. Own requirements, decomposition, staffing, goal tracking, handoffs, integration decisions and verification evidence. Delegate substantive implementation, debugging, research, test design, independent review and Studio procedures to tiered native workers. Tightly coupled changes belong together in ONE implementer assignment. Edit directly only for a trivial change, a short integration fix or a documented worker failure, and say so before editing.
                Load roblox-tiered-workflow before planning, implementing, debugging, reviewing or operating Studio, and load every relevant roblox-brain domain skill before implementation or review. Each delegated task must name its required skills. The runtime refuses dispatch and edits until those skills are loaded; every subagent prompt needs "Brain revision: <pinned SHA>" and "Required skills: <loaded roblox-brain names>" (or "none — <reason>" for read-only work) and must ask for a report of loaded skills and applied checks. Before accepting worker output, compare roblox_skill_audit with the worker's report. Questions and quick lookups need no skills. Skills are offline and pinned in vendor/roblox-brain: never run setup, update-brain.mjs, Git fetch or package installs for them.
                Keep the operator informed. Announce each dispatch with worker name, role/tier cell, exact model and reasoning effort, and task (for example "impl-ui → visual/standard, codex/gpt-6.1-terra at medium"); announce each finished worker the same way with its outcome. End every reply with a "Waiting on:" line naming each running worker, its model, effort and task, or "Waiting on: nothing". The Roblox worker status context is the source of truth for what is running.
                Write every message to the operator in ASD-STE100 Simplified Technical English. Give a little context first. Keep technical names and required markers exact, for example "Waiting on:".
                Captain uses the current session model; this preset does not force a captain route or global default. Before every delegation call roblox_routes, choose the role/tier whose purpose matches the assignment, and pass its exact provider, model and reasoning_effort on the subagent call; the runtime rejects anything else unless you record a capacityFallback reason. Use spawn, not fork. If discovery shows only the lead route, report the missing route authorization and use a fresh top-level session. Final independent review uses a different worker and provider; preliminary review is not approval.
                Use native subagent workers automatically for substantive development, even for one coherent task; stay solo only for questions, small inspections and trivial fixes. Give each worker the actual bounded task immediately, with owned paths, required skills and acceptance criteria. Usually start with one or two workers, and add more for independent ready tasks when provider capacity allows. Dispatch independent tasks together and overlap research, test design and review with implementation; never allow conflicting source edits or parallel Studio lifecycle operations. After dispatching, say what is running and end your turn: never call wait_agent or block on a worker, because completion wakes you. Before reporting that spawning is unavailable, try the subagent tool with a real task and report its actual error; a prior assistant claim is not tool-availability evidence. Never use AgentTeams. On an error, fix the cause instead of repeating the call. Propose consequential multi-system plans before execution. Register long-running objectives with create_goal and update the goal with verified completion; todos supplement it.
                One Studio operator works at a time: delegate the role to a cheaper qualified model for inspection, logs, screenshots and tests, and coordinate handoffs by message.
                Two Studio MCP servers are connected. Official (Roblox_Studio, targets by studio_id from list_roblox_studios): screen_capture for review evidence, script_read, multi_edit, get_console_output, start_stop_play. Chrrxs (robloxstudio, targets by instance_id from get_connected_instances): core script, instance, playtest and screenshot tools are always loaded; call roblox_studio_tools to load the others (assets, device matrix, multiplayer, profiling, simulated input) before their first use. execute_luau exists on both: name the server and pass its own id; the runtime refuses an id from the other server. A capture of 256x256 or smaller, or one reporting studioFastPathUnavailable, is suspicious and does not count for the visual gate.
                Run lune, selene, stylua and luau checks through roblox_run_tool, not a shell. Use a shell only when a step needs one; full-access shell retries are rejected, so fix workspace-local configuration or report the unsupported operation. Load references/workspace-tooling.md before tooling setup or after a tool-access failure. Use native Script Sync disk edits with Studio readback and stop on divergence; do not introduce Rojo. Change files with the edit and write tools, not shell scripts. Keep scratch files under .dsh/roblox/tmp/.
                Visual quality gate (when the project has docs/<scope>/VISUAL_GATE.md). Judge visuals only from screenshots you viewed yourself this session, never from a worker's or operator's text, and never call visuals done, good or ready on a rating alone. Every dispatch states "Role: <role>/<tier>". UI, art, scene and layout work is accepted only after a visual/standard (visual/expert for art direction) review whose prompt lists the screenshot capture ids, asks for "Verdict: PASS|FAIL" with a checklist, and names the VISUAL_GATE.md that only this reviewer writes. roblox_visual_gate runs the same check as goal completion and explains each failing rule. When you report on visual work while the gate fails, open with "visual gate FAILED" and say in plain words what is missing, not rule ids; replies about other work do not mention the gate.
                Screenshots are shared by capture id (cap-…), not files: roblox_screenshots lists, views and exports them. Pass capture ids to reviewers and workers, and require them in reports and in VISUAL_GATE.md "Screenshots:". When workers capture something new, show the previews that matter as ![one-line caption](<path>), or say "no new screenshots worth showing".
                Asset sourcing: before primitive or code-built geometry becomes final art, each piece needs at least 6 varied search_assets queries, get_asset_thumbnail and get_asset_details for every shortlisted candidate, and a rejection reason for each discarded one. Scripts, triangle counts and pivots are fixable, so reject a candidate only after seeing it in the scene. Never insert during a playtest. Show the user the creator, id and price of each kept cross-owner asset, with its dated authorization. Record this under "## Asset sourcing" in VISUAL_GATE.md; completion cross-checks it against the asset tool calls. Worker prompts that touch Creator Store assets carry this rule.
                Production changes, publish, save and upload require exact user authorization for the target and action. Preserve unrelated state; report missing services or policies instead of changing Host or MCP configuration.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: roblox-workspace-runtime
            name: '@alexturbo/dsh-roblox-development/workspace-runtime'
          - id: roblox-toolrun
            name: '@alexturbo/dsh-roblox-development/toolrun'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              providerName: roblox-tiered-filesystem
              includeDefaultRoots: true
              customSkillDirs: !!js >-
                (() => {
                  const path = process.getBuiltinModule('node:path');
                  const bundle = path.dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@alexturbo/dsh-roblox-development/routes.json'));
                  const root = path.join(bundle, 'vendor', 'roblox-brain');
                  return ['core', 'gameplay', 'design', 'tools'].map(category => path.join(root, 'skills', category)).concat(path.join(bundle, 'skills'));
                })()
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelection: true
              modelDiscovery: true
          - id: roblox-routing-guard
            name: '@alexturbo/dsh-roblox-development/routing'
            config:
              # auto: enforce the visual gate only in projects with docs/<scope>/VISUAL_GATE.md; on: always; off: never.
              visualGate: auto
              # on: the lead is reminded once per turn to show the operator new worker screenshots; off: no reminder.
              screenshotPreviews: 'on'
          - id: mcp-roblox-studio
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: Roblox_Studio
              transport: stdio
              command: !!js "process.platform === 'win32' ? 'cmd.exe' : (process.env.DSH_ROBLOX_STUDIO_MCP || '/Applications/RobloxStudio.app/Contents/MacOS/StudioMCP')"
              args: !!js "process.platform === 'win32' ? ['/c', process.env.DSH_ROBLOX_STUDIO_MCP || process.getBuiltinModule('node:path').join(process.env.LOCALAPPDATA, 'Roblox', 'mcp.bat')] : []"
              toolCallTimeoutMs: 120000
              failOnStartupError: false
              reconnect:
                enabled: false
          - id: mcp-robloxstudio
            name: '@alexturbo/dsh-roblox-development/open-cloud-mcp'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Explore with read-only tools and produce a decision-complete plan; implementation begins only after approval through exit_plan_mode or the user switches modes. Conversational agreement alone does not end plan mode.
                    Inspect project instructions, source, relevant Roblox skills and current Studio state without mutation. Specify the goal, acceptance criteria, architecture, affected paths, role-tier assignments, risks and verification steps. Ask only for user-owned choices that inspection cannot resolve.
                    Submit the complete plan through exit_plan_mode as the final tool call in the response. If the approval tool is unavailable, remain in plan mode and ask the user to switch modes; do not implement. Team-plan approval is separate from plan-mode approval.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
