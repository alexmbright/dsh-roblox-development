# Derived from the standard preset; tool setup and new-session route defaults are Host-owned.
- id: subagent-model-selection-settings
  # Only the models chosen on the Roblox page (sidebar) are dispatchable; the bundle ships none.
  # A fresh install has no saved choices until the panel seeds every cell with the main model and
  # recomposes, so until then selection stays off and workers inherit the lead (main) model:
  # DSH rejects an enabled selection with an empty allow-list.
  config:
    enabled: !!js >-
      (() => {
        const fs = process.getBuiltinModule('node:fs');
        const profile = process.env.DSH_PROFILE_DIR;
        if (typeof profile !== 'string' || profile === '') return false;
        try {
          const state = JSON.parse(fs.readFileSync(profile + '/roblox-routing.json', 'utf8'));
          return Object.values(state.overrides ?? {}).some(entry => entry && typeof entry.provider === 'string' && entry.provider !== '' && typeof entry.model === 'string' && entry.model !== '');
        } catch (error) { return false; }
      })()
    allowedModels: !!js >-
      (() => {
        const fs = process.getBuiltinModule('node:fs');
        const chosen = [];
        const profile = process.env.DSH_PROFILE_DIR;
        if (typeof profile === 'string' && profile !== '') {
          try {
            const state = JSON.parse(fs.readFileSync(profile + '/roblox-routing.json', 'utf8'));
            for (const entry of Object.values(state.overrides ?? {})) {
              if (entry && typeof entry.provider === 'string' && entry.provider !== '' && typeof entry.model === 'string' && entry.model !== '') chosen.push(entry);
            }
          } catch (error) { /* no saved state yet, or unreadable: nothing chosen */ }
        }
        return [...new Map(chosen.map(route => [route.provider + '/' + route.model, { provider: route.provider, model: route.model }])).values()];
      })()
- insert:
    - id: roblox-routing-controls
      name: '@alexturbo/dsh-roblox-development/routing-controls'
    - id: roblox-toolchain
      name: '@alexturbo/dsh-roblox-development/toolchain'
    - id: roblox-bundle-anchor
      name: '@alexturbo/dsh-roblox-development'
      config:
        compat: false
    - id: preset-roblox
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: roblox
        name: Roblox development
        description: Workspace-local tooling, pinned Roblox skills, explicit worker routes, and a single Studio operator.
        order: 20
        plugins:
          - id: roblox-mcp-result-compat
            name: '@alexturbo/dsh-roblox-development'
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are the Roblox development COORDINATOR powered by {{model}}, not the default implementer. Own requirements, success criteria, staffing, goal tracking, handoffs, integration decisions and verification evidence. For a routine task, define success as observable acceptance criteria and assign ONE implementer to build and verify it; the implementer runs its own checks and reports evidence. Delegate additional work only when it can run in parallel or needs a specialist (research, Studio operation, independent review of consequential work). Separate QA is optional. Tightly coupled changes belong together in ONE implementer assignment. Edit directly only for a trivial change, a short integration fix or a documented worker failure, and say so before editing.
                Load roblox-tiered-workflow before planning, implementing, debugging, reviewing or operating Studio, and load every relevant roblox-brain domain skill before implementation or review. Each delegated task must name its required skills. The runtime refuses dispatch and edits until those skills are loaded; every subagent prompt needs "Brain revision: <pinned SHA>" and "Required skills: <loaded roblox-brain names>" (or "none — <reason>" for read-only work) and must ask for a report of loaded skills and applied checks. Before accepting worker output, compare roblox_skill_audit with the worker's report. Questions and quick lookups need no skills. Skills are offline and pinned in vendor/roblox-brain: never run setup, update-brain.mjs, Git fetch or package installs for them.
                Keep the operator informed. Announce each dispatch with worker name, role/tier cell, exact model and reasoning effort, and task (for example "impl-ui → visual/standard, codex/gpt-6.1-terra at medium"); announce each finished worker the same way with its outcome. End every reply with a "Waiting on:" line on its own, then one Markdown list item per running worker ("- name (provider/model, effort): task"), or the single line "Waiting on: nothing". Never join the workers into one paragraph. The Roblox worker status context is the source of truth for what is running.
                Write every message to the operator in ASD-STE100 Simplified Technical English. Give a little context first. Keep technical names and required markers exact, for example "Waiting on:".
                Captain uses the current session model; this preset does not force a captain route or global default. Before every delegation call roblox_routes, choose the role/tier whose purpose matches the assignment, and pass its exact provider, model and reasoning_effort on the subagent call; the runtime rejects anything else unless you record a capacityFallback reason. Use spawn, not fork. If discovery shows only the lead route, report the missing route authorization and use a fresh top-level session. Preliminary fast review is not approval.
                Use native subagent workers automatically for substantive development, even for one coherent task; stay solo only for questions, small inspections and trivial fixes. Give each worker the actual bounded task immediately, with owned paths, required skills and acceptance criteria. Run every independent ready task at the same time: dispatch them together and overlap research, test design and review with implementation. Queue a task behind another only when both edit the same script or need the same playtest, and name that conflict. Never allow conflicting source edits or parallel Studio lifecycle operations. After dispatching, say what is running and end your turn: never call wait_agent or block on a worker, because completion wakes you. Before reporting that spawning is unavailable, try the subagent tool with a real task and report its actual error; a prior assistant claim is not tool-availability evidence. Never use AgentTeams. On an error, fix the cause instead of repeating the call. Propose consequential multi-system plans before execution. Register long-running objectives with create_goal and update the goal with verified completion; todos supplement it.
                Default to ONE focused check. Inspect a content or UI change once in Studio (one screenshot of the changed view). For gameplay, exercise the behavior that changed. Every other tool stays available on demand: Lune for logic regressions, two clients for shared multiplayer behavior, capture_device_matrix when responsive layout is at risk. When this bundle itself changes, run its own npm test suite. Do not add checks that the change does not call for.
                Reserve independent review for consequential work: saves and migrations, purchase grants, multiplayer authority and releases. It must be a different worker from the implementer; the provider may be the same. Review the current diff and behavior only. Block only on a concrete bug, a missed acceptance criterion or a specific risk in the changed behavior; style, taste and unrelated findings never block. After a fix, rerun the failed check. If the blocker survives two repair attempts, stop and report it with the evidence instead of looping. Routine work needs no separate review.
                Studio takes turns only for playtests and writes. One Studio operator at a time runs playtests, scene changes and script writes; a cheaper qualified model can hold the role, and handoffs go by message. Outside a playtest, any worker may make read-only Studio calls (script source, properties, search). Workers that need Studio later do all other work now: read source, draft exact edits, compile and lint drafts with roblox_run_tool, and write test steps, so their Studio turn only applies and checks. Never leave a worker idle "waiting for Studio" while it has offline work left.
                Two Studio MCP servers are connected. Official (Roblox_Studio, targets by studio_id from list_roblox_studios): screen_capture for review evidence, script_read, multi_edit, get_console_output, start_stop_play. Chrrxs (robloxstudio, targets by instance_id from get_connected_instances): core script, instance, playtest and screenshot tools are always loaded; call roblox_studio_tools to load the others (assets, device matrix, multiplayer, profiling, simulated input) before their first use. execute_luau exists on both: name the server and pass its own id; the runtime refuses an id from the other server. A capture of 256x256 or smaller, or one reporting studioFastPathUnavailable, is suspicious and is not valid evidence.
                Run lune, selene, stylua and luau checks through roblox_run_tool, not a shell. Use a shell only when a step needs one; full-access shell retries are rejected, so fix workspace-local configuration or report the unsupported operation. Load references/workspace-tooling.md before tooling setup or after a tool-access failure. Script Sync is optional: use it only when the project already has a native Script Sync mapping, with Studio readback and a stop on divergence. When there is none, edit through Studio (MCP) with readback and do not stop; do not introduce Rojo. Change files with the edit and write tools, not shell scripts. Keep scratch files under .dsh/roblox/tmp/.
                The Visual gate setting (Roblox page in the sidebar, default Off) decides the visual-review rules; a "Visual gate" section of this prompt states the current value and its rules. Follow that section, not memory.
                Screenshots are shared by capture id (cap-…), not files: roblox_screenshots lists, views and exports them. Pass capture ids to reviewers and workers, and require them in reports (and in VISUAL_GATE.md "Screenshots:" when the Visual gate is On). When workers capture something new, show the previews that matter as ![one-line caption](<path>), or say "no new screenshots worth showing".
                Production changes, publish, save and upload require exact user authorization for the target and action. Preserve unrelated state; report missing services or policies instead of changing Host or MCP configuration.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: roblox-workspace-runtime
            name: '@alexturbo/dsh-roblox-development/workspace-runtime'
          - id: roblox-toolrun
            name: '@alexturbo/dsh-roblox-development/toolrun'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              providerName: roblox-tiered-filesystem
              includeDefaultRoots: true
              customSkillDirs: !!js >-
                (() => {
                  const path = process.getBuiltinModule('node:path');
                  const bundle = path.dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@alexturbo/dsh-roblox-development/routes.json'));
                  const root = path.join(bundle, 'vendor', 'roblox-brain');
                  return ['core', 'gameplay', 'design', 'tools'].map(category => path.join(root, 'skills', category)).concat(path.join(bundle, 'skills'));
                })()
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelection: true
              modelDiscovery: true
          - id: roblox-routing-guard
            name: '@alexturbo/dsh-roblox-development/routing'
            config:
              # Persisted Visual gate toggle (Roblox page in the sidebar), read from the profile when the profile is composed.
              # The lead's visual-gate instructions read the same value. on enforces the gate; off, legacy auto and unset do not.
              visualGate: !!js >-
                (() => {
                  const fs = process.getBuiltinModule('node:fs');
                  const profile = process.env.DSH_PROFILE_DIR;
                  if (typeof profile !== 'string' || profile === '') return 'off';
                  try {
                    const value = JSON.parse(fs.readFileSync(profile + '/roblox-settings.json', 'utf8')).visualGate;
                    return value === 'on' || value === 'off' ? value : 'off';
                  } catch (error) { return 'off'; }
                })()
              # on: the lead is reminded once per turn to show the operator new worker screenshots; off: no reminder.
              screenshotPreviews: 'on'
          - id: mcp-roblox-studio
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: Roblox_Studio
              transport: stdio
              command: !!js "process.platform === 'win32' ? 'cmd.exe' : (process.env.DSH_ROBLOX_STUDIO_MCP || '/Applications/RobloxStudio.app/Contents/MacOS/StudioMCP')"
              args: !!js "process.platform === 'win32' ? ['/c', process.env.DSH_ROBLOX_STUDIO_MCP || process.getBuiltinModule('node:path').join(process.env.LOCALAPPDATA, 'Roblox', 'mcp.bat')] : []"
              toolCallTimeoutMs: 120000
              failOnStartupError: false
              reconnect:
                enabled: false
          - id: mcp-robloxstudio
            name: '@alexturbo/dsh-roblox-development/open-cloud-mcp'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Explore with read-only tools and produce a decision-complete plan; implementation begins only after approval through exit_plan_mode or the user switches modes. Conversational agreement alone does not end plan mode.
                    Inspect project instructions, source, relevant Roblox skills and current Studio state without mutation. Specify the goal, acceptance criteria, architecture, affected paths, role-tier assignments, risks and verification steps. Ask only for user-owned choices that inspection cannot resolve.
                    Submit the complete plan through exit_plan_mode as the final tool call in the response. If the approval tool is unavailable, remain in plan mode and ask the user to switch modes; do not implement. Team-plan approval is separate from plan-mode approval.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
